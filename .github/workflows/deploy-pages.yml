# Deploys CodeOrbit to GitHub Pages on every push to main.
# Hosting is owned by the LetsCook-Organization GitHub org (see docs/DECISIONS.md D-012).
#
# One-time setup (repo admin): Settings → Pages → Build and deployment → Source: "GitHub Actions".
#
# Actions are pinned to full commit SHAs (the version is in the comment) so a
# moved tag cannot change what runs here. Dependabot keeps them up to date.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: read the repo, write only to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deploy halfway; queue the next one instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      # Static site, no build step: publish the repository as-is.
      # Hidden folders (.git, .github) are excluded by the upload action.
      - name: Upload site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
