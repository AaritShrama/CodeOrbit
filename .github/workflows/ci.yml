# CodeOrbit CI: checks every pull request and every push to main.
# On main, the site deploys to GitHub Pages ONLY if lint, format and unit tests pass.
# See docs/DECISIONS.md D-012 (hosting), D-014 (lint/format) and D-015 (tests).
#
# One-time setup (repo admin): Settings → Pages → Source: "GitHub Actions".
# Actions are pinned to full commit SHAs (version in the comment); Dependabot updates them.

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Default for every job: read-only. The deploy job asks for more below.
permissions:
  contents: read

jobs:
  check:
    # Job name is used by the branch ruleset's required checks; rename with care.
    name: Lint & format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dev tools (exact versions from package-lock.json)
        run: npm ci --ignore-scripts

      - name: ESLint
        run: npm run lint

      - name: Prettier
        run: npm run format:check

  test:
    # Job name is used by the branch ruleset's required checks; rename with care.
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dev tools (exact versions from package-lock.json)
        run: npm ci --ignore-scripts

      - name: Unit tests in 4 timezones (India, UTC, US West, UTC+14)
        run: npm test

  deploy:
    name: Deploy to GitHub Pages
    needs: [check, test]
    # Only real pushes to main deploy; pull requests (including from forks) never do.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    # Never cancel a deploy halfway; queue the next one instead.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      # Static site, no build step. Hidden folders (.git, .github) are excluded by the
      # upload action; dev-only files are removed so they are not published.
      - name: Remove development-only files
        run: rm -rf node_modules package.json package-lock.json eslint.config.js tests scripts

      - name: Upload site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
